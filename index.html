<!DOCTYPE html>
<html lang="en">
<head>
    <meta name="google-site-verification" content="7jSmvN7zZFo0vHiRvY1PbhMVbrsvtciNeOyXJbJXJj4" />
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CalcHub</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="container">

        <h1>CalcHub 🧮</h1>
        <p class="tagline">Smart calculators, all in one place.</p>

        <!-- Age Calculator -->
        <div class="calculator">
            <h2>🎂 Age Calculator</h2>

            <label for="birthDate">Enter your birth date:</label>
            <input type="date" id="birthDate">

            <button onclick="calculateAge()">Calculate Age</button>

            <div id="ageResult" class="result"></div>
        </div>


        <!-- BMI Calculator -->
        <div class="calculator">
            <h2>⚖️ BMI Calculator</h2>

            <label for="weight">Weight (kg):</label>
            <input type="number" id="weight" placeholder="Enter weight">

            <label for="height">Height (cm):</label>
            <input type="number" id="height" placeholder="Enter height">

            <button onclick="calculateBMI()">Calculate BMI</button>

            <div id="bmiResult" class="result"></div>
        </div>

    </div>

    <script src="script.js"></script>

</body>
</html>
